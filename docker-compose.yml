services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env.test
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - my_network

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      # The browser PUTs videos direct to the S3 endpoint (presigned URLs);
      # allow only the local dev app origins instead of reflecting any Origin.
      - RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - rustfs_data:/data
    networks:
      - my_network
    command:
      ["--access-key", "rustfsadmin", "--secret-key", "rustfsadmin", "/data"]

  lightpanda:
    image: lightpanda/browser:nightly@sha256:4307c2b2cce54c2e90351f0084dbc1e07ae424c7caf47632fab033f7401b8b67
    ports:
      - "127.0.0.1:9223:9222"
    networks:
      - my_network

  otelite:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4000:3000"
    volumes:
      - otelite_data:/home/ozaki/.local/share/otelite

networks:
  my_network:
    driver: bridge

volumes:
  pgdata:
  rustfs_data:
  otelite_data:
