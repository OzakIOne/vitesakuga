services:
  postgres:
    container_name: postgres
    image: postgres:18
    ports:
      - "5432:5432"
    env_file:
      - .env.test
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - my_network

  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=GK1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
      - GARAGE_DEFAULT_SECRET_KEY=1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
      - GARAGE_DEFAULT_BUCKET=e2e-test
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta:/meta
      - garage_data:/data
    networks:
      - my_network
    command: ["/garage", "server", "--single-node", "--default-bucket"]

  # drizzle-gate:
  #   image: ghcr.io/drizzle-team/gateway:latest
  #   container_name: drizzle-gate
  #   restart: always
  #   ports:
  #     - "4983:4983"
  #   environment:
  #     - PORT=4983
  #     - MASTERPASS=ozaki
  #   volumes:
  #     - drizzle:/app
  #   networks:
  #     - my_network

  lightpanda:
    container_name: lightpanda
    image: lightpanda/browser:nightly
    ports:
      - "127.0.0.1:9223:9222"
    networks:
      - my_network

  otelite:
    build: .
    ports:
      - "4317:4317"
      - "4318:4318"
      - "4000:3000"
    volumes:
      - otelite_data:/home/ozaki/.local/share/otelite

networks:
  my_network:
    driver: bridge

volumes:
  pgdata:
  garage_meta:
  garage_data:
  otelite_data:
  # drizzle:
