name: Deploy production release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://sakuga.ozaki.one/login' }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      MAX_ERROR_RATE: ${{ vars.MAX_ERROR_RATE || '0.10' }}
      MIN_REQUESTS: ${{ vars.MIN_REQUESTS || '20' }}
      MONITOR_ATTEMPTS: ${{ vars.MONITOR_ATTEMPTS || '5' }}
      MONITOR_INTERVAL_SECONDS: ${{ vars.MONITOR_INTERVAL_SECONDS || '60' }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Nub and pinned Node
        uses: nubjs/setup-nub@v0

      - name: Write production environment
        shell: bash
        run: |
          if [[ -z "$PRODUCTION_ENV_FILE" ]]; then
            echo "::error::Configure the production environment file secret"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .env.production

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Capture active Worker version
        run: nub scripts/cloudflare-release.mjs capture

      - name: Build production bundle
        id: deploy
        run: |
          nub run build
          nub scripts/check-prod-build.mjs
          nubx alchemy deploy infra/alchemy.run.ts --stage production --env-file .env.production

      - name: Record deployed Worker version
        id: mark_deployed
        if: steps.deploy.outcome == 'success'
        run: nub scripts/cloudflare-release.mjs mark-deployed

      - name: Monitor release health
        id: monitor
        if: always() && steps.deploy.outcome == 'success' && steps.mark_deployed.outcome == 'success'
        continue-on-error: true
        run: nub scripts/cloudflare-release.mjs monitor

      - name: Roll back unhealthy release
        if: >-
          always() && steps.deploy.outcome == 'success' &&
          (steps.mark_deployed.outcome == 'failure' || steps.monitor.outcome == 'failure')
        run: nub scripts/cloudflare-release.mjs rollback

      - name: Fail release after health rollback
        if: >-
          always() &&
          (steps.deploy.outcome != 'success' ||
          steps.mark_deployed.outcome != 'success' ||
          steps.monitor.outcome == 'failure')
        run: exit 1
