name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Worker version ID to restore; empty restores previous version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Roll back Worker
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ -n "$VERSION_ID" ]]; then
            pnpm exec wrangler rollback "$VERSION_ID" \
              --name "${CLOUDFLARE_WORKER_NAME:-vitesakuga-infra-sakugaworker-production-5osp6ydh4rodg534}" \
              --message "Manual production rollback"
          else
            pnpm exec wrangler rollback \
              --name "${CLOUDFLARE_WORKER_NAME:-vitesakuga-infra-sakugaworker-production-5osp6ydh4rodg534}" \
              --message "Manual production rollback to previous version"
          fi
